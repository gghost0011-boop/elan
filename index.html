<html lang="fr">
<head>

<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e4e2db;--accent:#2f6fed;--hi:#d9432f;--mid:#e0a020;--lo:#3a9d5d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#161615;--card:#222221;--text:#f0efea;--muted:#a09f98;--line:#35342f;--accent:#6b9bff;--hi:#ff7a66;--mid:#f0b840;--lo:#5ccb86;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:16px 14px 40px}
h1{margin:0 0 10px;font-size:1.5rem}
button,input,select{font:inherit;color:inherit}
.tabs,.nav,.tools{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.tabs button,.nav button,.tools button,.tools input{padding:9px 10px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
.tabs button{flex:1}.tabs .on{background:var(--accent);color:var(--act,#fff);border-color:var(--accent)}
.nav b{flex:1;text-align:center;text-transform:capitalize}
.tools{flex-wrap:wrap;margin-top:14px}.tools .on{border-color:var(--lo);color:var(--lo)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lo);transition:width .3s}
.stat{font-size:.85rem;color:var(--muted);margin:6px 0 14px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
form input,form select,form button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}

.chk{display:flex;gap:8px;align-items:center;font-size:.95rem}.chk input{width:20px;height:20px}
.task{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.p1{border-left-color:var(--hi)}.p2{border-left-color:var(--mid)}
.task.now{outline:2px solid var(--accent)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.int,.task.stop{opacity:.8}
.row{display:flex;gap:10px;align-items:flex-start}
.row input{width:22px;height:22px;margin-top:2px;flex:none}
.body{flex:1;min-width:0}
.time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.t{word-break:break-word}
.st{font-size:.82rem;margin-top:2px;color:var(--mid)}.done .st{color:var(--lo)}.stop .st{color:var(--hi)}
.mo{background:none;border:0;font-size:1.3rem;color:var(--muted);cursor:pointer;padding:0 4px}

.wk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.wk.today{outline:2px solid var(--accent)}
.wh{display:flex;justify-content:space-between;width:100%;background:none;border:0;font-weight:600;padding:2px 0 6px;cursor:pointer;text-transform:capitalize}
.wi{border-left:4px solid var(--lo);padding:3px 8px;margin-bottom:4px;font-size:.92rem;cursor:pointer}
.wi.done{text-decoration:line-through;color:var(--muted)}
.mut{color:var(--muted);font-size:.85rem}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{text-align:center;font-size:.75rem;color:var(--muted)}
.mc{min-height:62px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.mc.today{border-color:var(--accent);border-width:2px}.mc.sel{background:var(--line)}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.d{width:8px;height:8px;border-radius:50%;background:var(--lo)}
.d.p1{background:var(--hi)}.d.p2{background:var(--mid)}.d.dn{opacity:.35}
.lg{font-size:.8rem;color:var(--muted);margin-top:10px}
.tabs button{font-size:.85rem;padding:9px 4px}
form textarea{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;color:inherit}
.wd label{margin-right:8px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.srow{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
.sb{display:flex;gap:6px;font-size:.88rem;margin-top:2px}.sb input{width:16px;height:16px}
.tl{position:relative;margin:0 0 12px 38px}
.hl{position:absolute;left:-38px;right:0;border-top:1px solid var(--line);font-size:.7rem;color:var(--muted)}
.hl span{position:absolute;left:0;top:-9px;background:var(--bg);padding-right:4px}
.tb{position:absolute;left:0;right:0;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:8px;padding:2px 8px;font-size:.85rem;overflow:hidden;cursor:pointer}
.tb.p1{border-left-color:var(--hi)}.tb.p2{border-left-color:var(--mid)}.tb.done{opacity:.5;text-decoration:line-through}
.shd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(680px,100%);max-height:88vh;overflow:auto;z-index:20;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tools .add{flex:1;background:var(--accent);color:var(--act,#fff);border-color:var(--accent);font-weight:600}
.optb{display:block;margin:6px auto 10px;background:none;border:0;color:var(--muted);cursor:pointer;padding:8px}
form select:disabled{opacity:.35}
.cd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.sty{display:flex;align-items:center;gap:8px;padding:10px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-size:.9rem}
.sty i{width:18px;height:18px;border-radius:50%;flex:none}.sty.on{border-color:var(--accent)}
#toast.cb{pointer-events:auto;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<h1>Ma journée</h1>
<div class="tabs"><button data-v="d">Jour</button><button data-v="w">Semaine</button><button data-v="m">Mois</button><button data-v="b">Bilan</button><button data-v="s">⚙</button></div>
<div class="nav"><button id="pv">‹</button><b id="lbl"></b><button id="nx">›</button><button id="td">Aujourd’hui</button></div>
<div id="v"></div>
</main>
<div id="toast"></div>
<script>
var K="planner-v2",S={tasks:[],tpls:[],gen:{}},view="d",editId=null,opened=null,notified={},DUR=[15,30,45,60,90,120,180,240,300,360,480,600,720],ST={done:"Terminée",int:"Interrompue",stop:"Arrêtée"},CATS=["Cours","Business","Sport","Perso","Autre"],WD=["L","M","M","J","V","S","D"],undo=null,pm=null,q="",fc="",tl=0,sh=0,opt=0,sel=null;
function p2(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}

var STY={classic:["Classique"],

CATC={Cours:"#4c8bf5",Business:"#e07b39",Sport:"#2fa36b",Perso:"#b85fd0",Autre:"#8a8f98"};
function cc(c){return CATC[c]||"#8a8f98"}
function dot(c){return c?'<i class="cd" style="background:'+cc(c)+'"></i>':""}
function isDark(){try{return S.theme=="dark"||(!S.theme&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}catch(e){return false}}
function applyTheme(){
  var r=document.documentElement,st=STY[S.style]||STY.classic,dk=isDark(),ks=["bg","card","line","accent","act"];
  if(S.theme)r.setAttribute("data-theme",S.theme);else r.removeAttribute("data-theme");
  ks.forEach(function(k){r.style.removeProperty("--"+k)});
  if(st.length>1)ks.slice(0,dk?5:4).forEach(function(k,i){r.style.setProperty("--"+k,st[(dk?5:1)+i])});
  try{var m=document.querySelector("meta[name=theme-color]"),b=getComputedStyle(r).getPropertyValue("--bg").trim();if(m&&b)m.content=b}catch(e){}}

function dlf(n,t,ty){var f=new File([t],n,{type:ty});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}else{var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=n;a.click()}}
function restore(f){if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.tasks||!o.tpls)throw 0;if(!confirm("Remplacer toutes les données actuelles par la sauvegarde ("+o.tasks.length+" tâches)?"))return;S=o;save();applyTheme();render();toast("Sauvegarde restaurée")}catch(e){toast("Fichier invalide")}};r.readAsText(f)}
function ics(){
  var f=function(x){return iso(x).replace(/-/g,"")+"T"+p2(x.getHours())+p2(x.getMinutes())+"00"},q2=function(z){return String(z||"").replace(/[\\;,]/g,"\\$&").replace(/\n/g,"\\n")},
  L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ma journee//FR","CALSCALE:GREGORIAN"],td=iso(new Date()),stamp=new Date().toISOString().replace(/[-:]|\.\d+/g,""),
  ev=function(t,date,rule){var a=parse(date),b=parse(date);a.setMinutes(mins(t.start));b.setMinutes(mins(t.start)+t.dur);L.push("BEGIN:VEVENT","UID:"+t.id+"@majournee","DTSTAMP:"+stamp,"DTSTART:"+f(a),(t.dur?"DTEND:"+f(b):"X-POINT:1"),"SUMMARY:"+q2(t.title));if(rule)L.push(rule);if(t.note)L.push("DESCRIPTION:"+q2(t.note));if(t.cat)L.push("CATEGORIES:"+q2(t.cat));L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Rappel","TRIGGER:-PT5M","END:VALARM","END:VEVENT")};
  S.tasks.filter(function(t){return!t.tp&&t.date>=td}).forEach(function(t){ev(t,t.date)});

function noteHTML(t){return(t.note||"").split("\n").map(function(x,i){var m=/^(-|x) (.*)/.exec(x);return m?'<label class="sb"><input type="checkbox" data-act="sub" data-id="'+t.id+'" data-i="'+i+'"'+(m[1]=="x"?" checked":"")+'> '+esc(m[2])+'</label>':(x.trim()?'<div class="mut">'+esc(x)+'</div>':"")}).join("")}
function tlHTML(l){if(!l.length)return"";var k=.8,s0=Math.floor(Math.min.apply(null,l.map(function(t){return mins(t.start)}))/60),e0=Math.min(24,Math.ceil(Math.max.apply(null,l.map(function(t){return Math.min(1440,mins(t.start)+Math.max(t.dur,30))}))/60)),h='<div class="tl" style="height:'+(e0-s0)*60*k+'px">';

  l.forEach(function(t){h+='<div class="tb p'+t.pri+" "+(t.st||"")+'" data-act="edit" data-id="'+t.id+'" style="top:'+(mins(t.start)-s0*60)*k+'px;height:'+Math.max(22,t.dur*k)+'px">'+dot(t.cat)+fmt(mins(t.start))+" "+esc(t.title)+"</div>"});return h+"</div>"}
function statsHTML(){
  var d=parse(cur),y=d.getFullYear(),m=d.getMonth();document.getElementById("lbl").textContent=d.toLocaleDateString("fr-CA",{month:"long",year:"numeric"});
  var l=S.tasks.filter(function(t){var a=parse(t.date);return a.getFullYear()==y&&a.getMonth()==m});
  if(!l.length)return'<div class="mut" style="text-align:center;padding:20px 0">Aucune donnée ce mois-ci.</div>';
  var c={done:0,int:0,stop:0,"":0},plan=0,real=0,bc={},bp={1:[0,0],2:[0,0],3:[0,0]},why={};

    var k=t.cat||"Sans catégorie";bc[k]=bc[k]||[0,0,0];bc[k][0]++;bc[k][1]+=t.dur;if(t.st=="done")bc[k][2]++;bp[t.pri][0]++;if(t.st=="done")bp[t.pri][1]++;if(t.why)why[t.why]=(why[t.why]||0)+1});
  var h='<div class="card"><b>'+l.length+' tâches</b> · '+Math.round(c.done/l.length*100)+' % terminées<br><span class="mut">'+c.done+' terminées · '+c.int+' interrompues · '+c.stop+' arrêtées · '+c[""]+' sans suivi</span></div>';
  h+='<div class="card">Temps prévu : <b>'+dl(plan)+'</b><br>Temps réellement tenu : <b>'+dl(real)+'</b> ('+(plan?Math.round(real/plan*100):0)+' %)</div><div class="card"><b>Par catégorie</b>';
  Object.keys(bc).forEach(function(k){var v=bc[k];h+='<div class="srow"><span>'+dot(k)+esc(k)+'</span><div class="bar"><i style="width:'+v[2]/v[0]*100+'%"></i></div><span>'+v[2]+"/"+v[0]+" · "+dl(v[1])+'</span></div>'});
  h+='</div><div class="card"><b>Par priorité</b> (terminées)<br>'+[1,2,3].map(function(p){return["","Haute","Moyenne","Basse"][p]+" : "+bp[p][1]+"/"+bp[p][0]}).join(" · ")+'</div>';
  var w=Object.keys(why).sort(function(a,b){return why[b]-why[a]}).slice(0,5);
  if(w.length)h+='<div class="card"><b>Raisons d’interruption fréquentes</b><br>'+w.map(function(k){return esc(k)+" ("+why[k]+")"}).join("<br>")+'</div>';
  return h}
function setHTML(){document.getElementById("lbl").textContent="Réglages";
  return'<div class="card"><b>Style</b><div class="stg">'+styleBtns()+'</div></div><div class="card"><b>Mode</b><br><select id="th">'+[["","Auto"],["light","Clair"],["dark","Sombre"]].map(function(x){return'<option value="'+x[0]+'"'+((S.theme||"")==x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select><br><br><b>Durée par défaut</b><br><select id="dd">'+opts(DUR,S.dd||60,dl)+'</select></div><div class="card"><b>Données</b><div class="tools"><button data-act="bk">Sauvegarder</button><button data-act="rs">Restaurer</button><button data-act="ics">Export Calendrier (.ics)</button></div><span class="mut">La sauvegarde contient toutes tes tâches. Le .ics s’importe dans l’app Calendrier, avec une alerte 5 min avant chaque tâche.</span></div><input type="file" id="fi" accept=".json,application/json" hidden>'}
function formHTML(e,all){
  var last=all[all.length-1],dys=e.tp?((S.tpls.filter(function(x){return x.id==e.tp})[0]||{}).days||[0,1,2,3,4,5,6]):[];
  return'<div class="shd" data-act="cancel"></div><form id="f" class="sheet"><b class="full">'+(editId?"Modifier la tâche":"Nouvelle tâche")+'</b><input class="full" id="title" placeholder="Titre…" required value="'+esc(e.title||"")+'"><input type="time" id="start" required value="'+(e.start||(last?hhmm(mins(last.start)+last.dur):"09:00"))+'"><select id="dur"'+(e.dur===0?" disabled":"")+'>'+opts(DUR,e.dur||S.dd||60,dl)+'</select><label class="chk full"><input type="checkbox" id="pt"'+(e.dur===0?" checked":"")+'> Heure précise (sans durée)</label><select id="pri">'+opts([1,2,3],e.pri||2,function(v){return["","Priorité haute","Priorité moyenne","Priorité basse"][v]})+'</select><select id="cat">'+opts([""].concat(CATS),e.cat||fc,function(v){return v||"Sans catégorie"})+'</select><input type="date" id="date" class="full" required value="'+(e.date||cur)+'"><div class="full"><span class="mut">Répéter les :</span> <span class="wd">'+WD.map(function(x,i){return'<label><input type="checkbox" id="rd'+i+'"'+(dys.indexOf(i)>-1?" checked":"")+'>'+x+'</label>'}).join("")+'</span></div><textarea class="full" id="note" rows="2" placeholder="Notes… (une ligne « - texte » crée une sous-tâche à cocher)">'+esc(e.note||"")+'</textarea><button class="full" type="submit">'+(editId?"Enregistrer":"Ajouter")+'</button><button class="full ghost" type="button" data-act="cancel">Annuler</button></form>'}
function dayHTML(td){
  var all=day(cur),e=(editId&&find(editId))||{},dn=all.filter(function(t){return t.st=="done"}).length,nowM=new Date().getHours()*60+new Date().getMinutes(),
  l=all.filter(function(t){return(!fc||t.cat==fc)&&(!q||(t.title+" "+(t.note||"")).toLowerCase().indexOf(q.toLowerCase())>-1)}),ns=sel?Object.keys(sel).filter(function(k){return sel[k]}).length:0;
  var h='<div class="bar"><i style="width:'+(all.length?dn/all.length*100:0)+'%"></i></div><div class="stat">'+dn+' sur '+all.length+' terminée'+(dn>1?"s":"")+'</div>';
  if(sel)h+='<div class="card"><b>'+ns+'</b> sélectionnée'+(ns>1?"s":"")+'<div class="tools" style="margin:8px 0 0"><button data-act="selok">Copier</button><button data-act="selall">Tout</button><button data-act="selno">Annuler</button></div></div>';
  h+=!l.length?'<div class="mut" style="text-align:center;padding:20px 0">Aucune tâche à afficher.</div>':tl?tlHTML(l):l.map(function(t){
    var s=mins(t.start),now=cur==td&&!t.st&&nowM>=s&&nowM<s+(t.dur||5),ov=over(t,all).length;
    return'<div class="task p'+t.pri+" "+(t.st||"")+(now?" now":"")+'" data-id="'+t.id+'"><div class="row">'+(sel?'<input type="checkbox" data-act="pick" data-id="'+t.id+'"'+(sel[t.id]?" checked":"")+'>':'<input type="checkbox" data-act="done" data-id="'+t.id+'"'+(t.st=="done"?" checked":"")+'>')+'<div class="body"><div class="time">'+(t.dur?fmt(s)+" – "+fmt(s+t.dur):fmt(s))+(t.cat?" · "+dot(t.cat)+esc(t.cat):"")+(now?" · en cours":"")+(ov?" · ⚠ chevauche":"")+(t.tp?" · ↻":"")+'</div><div class="t">'+esc(t.title)+'</div>'+noteHTML(t)+(t.st?'<div class="st">'+ST[t.st]+" à "+t.at+(t.why?" · "+esc(t.why):"")+'</div>':"")+'</div><button class="mo" data-act="open" data-id="'+t.id+'" aria-label="Options">⋯</button></div>'+(opened==t.id?'<div class="acts"><button data-act="done" data-id="'+t.id+'">'+(t.st=="done"?"Rouvrir":"Terminée")+'</button><button data-act="int" data-id="'+t.id+'">Interrompue</button><button data-act="stop" data-id="'+t.id+'">Arrêtée</button><button data-act="edit" data-id="'+t.id+'">Modifier</button><button data-act="del" data-id="'+t.id+'">Supprimer</button></div>':"")+'</div>'}).join("");
  h+='<div class="tools"><button class="add" data-act="add">+ Ajouter une tâche</button>'+(S.clip&&S.clip.length?'<button data-act="paste">Coller ('+S.clip.length+')</button>':"")+'</div><button class="optb" data-act="opt">Options '+(opt?"▴":"▾")+'</button>';
  if(opt)h+='<div class="card flt"><div class="tools" style="margin-top:0"><input id="q" placeholder="Rechercher…" value="'+esc(q)+'"><select id="fc">'+opts([""].concat(CATS),fc,function(v){return v||"Toutes catégories"})+'</select></div><div class="tools"><button data-act="tl" class="'+(tl?"on":"")+'">Blocs horaires</button><button data-act="selmode">Copier des tâches</button><button data-act="exp">Exporter</button><button data-act="rem" class="'+(S.rem?"on":"")+'">Rappels '+(S.rem?"activés":"désactivés")+'</button><button data-act="pm">'+(pm?"Arrêter le minuteur":"Minuteur 25/5")+'</button><span id="pmv" class="mut"></span></div><div class="mut">Glisse une tâche vers la gauche (ou ⋯) pour ses options.</div></div>';
  if(sh||editId)h+=formHTML(e,all);
  return h}
function render(){
  var td=iso(new Date()),el=document.getElementById("v"),L=document.getElementById("lbl"),d=parse(cur),h="";
  document.querySelectorAll(".tabs button").forEach(function(b){b.className=b.dataset.v==view?"on":""});
  if(view=="d"){L.textContent=d.toLocaleDateString("fr-CA",{weekday:"long",day:"numeric",month:"long"});h=dayHTML(td)}
  else if(view=="w"){
    var mo=new Date(d);mo.setDate(d.getDate()-((d.getDay()+6)%7));L.textContent="Semaine du "+mo.toLocaleDateString("fr-CA",{day:"numeric",month:"short"});
    for(var i=0;i<7;i++){var x=new Date(mo);x.setDate(mo.getDate()+i);var ds=iso(x),l=day(ds);
      h+='<div class="wk'+(ds==td?" today":"")+'"><button class="wh" data-go="'+ds+'">'+x.toLocaleDateString("fr-CA",{weekday:"long",day:"numeric"})+'<span>+</span></button>'+(l.length?l.map(function(t){return'<div class="wi p'+t.pri+(t.st=="done"?" done":"")+'" data-go="'+ds+'"><span class="time">'+fmt(mins(t.start))+'</span> '+dot(t.cat)+esc(t.title)+'</div>'}).join(""):'<div class="mut">Rien de prévu</div>')+'</div>'}}
  else if(view=="b")h=statsHTML();
  else if(view=="s")h=setHTML();
  else{
    var y=d.getFullYear(),m=d.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
    L.textContent=d.toLocaleDateString("fr-CA",{month:"long",year:"numeric"});
    h='<div class="mg">'+["L","M","M","J","V","S","D"].map(function(x){return'<div class="mh">'+x+'</div>'}).join("");
    for(var j=0;j<off;j++)h+="<div></div>";
    for(var k=1;k<=n;k++){var dk=y+"-"+p2(m+1)+"-"+p2(k),lk=day(dk);
      h+='<button class="mc'+(dk==td?" today":"")+(dk==cur?" sel":"")+'" data-go="'+dk+'"><b>'+k+'</b><div class="dots">'+lk.slice(0,6).map(function(t){return'<i class="d p'+t.pri+(t.st=="done"?" dn":"")+'"></i>'}).join("")+'</div>'+(lk.length>6?"<small>+"+(lk.length-6)+"</small>":"")+'</button>'}
    h+='</div><div class="lg"><i class="d p1" style="display:inline-block"></i> haute &nbsp;<i class="d p2" style="display:inline-block"></i> moyenne &nbsp;<i class="d" style="display:inline-block"></i> basse. Touche un jour pour l’ouvrir.</div>'}
  el.innerHTML=h}
function step(n){var d=parse(cur);if(view=="m"||view=="b"){d.setDate(1);d.setMonth(d.getMonth()+n)}else d.setDate(d.getDate()+(view=="w"?7*n:n));cur=iso(d);editId=null;sh=0;sel=null;render()}
function setSt(t,s,why){if(t.st==s){t.st="";t.at="";t.why=""}else{t.st=s;t.at=nowHM();t.why=why||""}}
document.getElementById("pv").onclick=function(){step(-1)};
document.getElementById("nx").onclick=function(){step(1)};
document.getElementById("td").onclick=function(){cur=iso(new Date());editId=null;sh=0;sel=null;render()};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act],[data-v],[data-go]");if(!b)return;
  var a=b.dataset.act,id=b.dataset.id,t=id?find(id):null;
  if(b.dataset.v){view=b.dataset.v;editId=null;sh=0;sel=null}
  else if(b.dataset.go){cur=b.dataset.go;view="d";editId=null;sh=0;sel=null}
  else if(a=="open")opened=opened==id?null:id;
  else if(a=="done"&&t){setSt(t,"done");opened=null;save()}
  else if((a=="int"||a=="stop")&&t){var w=prompt("Raison (facultatif)");if(w===null)return;t.st="";setSt(t,a,w.trim());opened=null;save()}
  else if(a=="edit"){editId=id;opened=null}
  else if(a=="cancel"){editId=null;sh=0}
  else if(a=="del"&&t){var u=t;S.tasks=S.tasks.filter(function(x){return x.id!=id});opened=null;save();toast("Tâche supprimée · Annuler",function(){S.tasks.push(u);save();render()})}
  else if(a=="add"){sh=1;editId=null}
  else if(a=="opt")opt=opt?0:1;
  else if(a=="selmode"){sel={};opt=0}
  else if(a=="selno")sel=null;
  else if(a=="selall"){day(cur).forEach(function(x){sel[x.id]=1})}
  else if(a=="pick"){sel[id]=!sel[id]}
  else if(a=="selok"){var ch=day(cur).filter(function(x){return sel[x.id]});if(!ch.length){toast("Sélectionne au moins une tâche");return}S.clip=ch.map(function(x){return{title:x.title,start:x.start,dur:x.dur,pri:x.pri,cat:x.cat,note:(x.note||"").replace(/^x /gm,"- ")}});sel=null;save();toast(ch.length+" tâche"+(ch.length>1?"s":"")+" copiée"+(ch.length>1?"s":"")+" · ouvre un autre jour et touche Coller")}
  else if(a=="paste"){var cl=S.clip||[];cl.forEach(function(x){S.tasks.push({id:uid(),title:x.title,start:x.start,dur:x.dur,pri:x.pri,cat:x.cat,note:x.note,date:cur,st:""})});save();toast(cl.length+" tâche"+(cl.length>1?"s":"")+" collée"+(cl.length>1?"s":""))}
  else if(a=="exp"){var txt="Planning du "+cur+"\n"+day(cur).map(function(x){return (x.dur?fmt(mins(x.start))+"–"+fmt(mins(x.start)+x.dur):fmt(mins(x.start)))+" "+x.title+(x.st?" ("+ST[x.st].toLowerCase()+" à "+x.at+(x.why?", "+x.why:"")+")":"")}).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast("Planning copié")},function(){prompt("Copie ce texte :",txt)});return}
  else if(a=="rem"){if(!S.rem){if(window.Notification&&Notification.permission=="default")Notification.requestPermission();S.rem=1;toast("Rappels actifs (app ouverte)")}else S.rem=0;save()}
  else if(a=="sub"&&t){var ls=t.note.split("\n"),i=+b.dataset.i;ls[i]=(ls[i][0]=="x"?"- ":"x ")+ls[i].slice(2);t.note=ls.join("\n");save()}
  else if(a=="sty"){S.style=id;save();applyTheme()}
  else if(a=="tl")tl=tl?0:1;
  else if(a=="pm"){if(pm){pm=null;document.title="Ma journée"}else pm={work:1,end:Date.now()+15e5}}
  else if(a=="bk"){dlf("ma-journee-sauvegarde-"+iso(new Date())+".json",JSON.stringify(S),"application/json");return}
  else if(a=="rs"){document.getElementById("fi").click();return}
  else if(a=="ics"){ics();return}
  else return;
  render()});
document.getElementById("v").addEventListener("submit",function(e){
  e.preventDefault();
  var g=function(i){return document.getElementById(i)},o={title:g("title").value.trim(),start:g("start").value,dur:g("pt").checked?0:+g("dur").value,pri:+g("pri").value,date:g("date").value,cat:g("cat").value,note:g("note").value},days=WD.map(function(_,i){return g("rd"+i).checked?i:-1}).filter(function(i){return i>=0}),rep=days.length>0;
  var ex=editId?find(editId):null,t=ex||{id:uid(),st:""},ov=over(Object.assign({},t,o),day(o.date));
  if(ov.length&&!confirm("Chevauche « "+ov[0].title+" ». Ajouter quand même?"))return;
  Object.assign(t,o);if(!ex)S.tasks.push(t);
  if(rep){if(!t.tp){t.tp=uid();S.tpls.push({id:t.tp});S.gen[t.date]=1}Object.assign(S.tpls.filter(function(x){return x.id==t.tp})[0],{title:o.title,start:o.start,dur:o.dur,pri:o.pri,cat:o.cat,note:o.note,days:days})}
  else if(t.tp){S.tpls=S.tpls.filter(function(x){return x.id!=t.tp});delete t.tp}
  editId=null;sh=0;cur=o.date;save();render()});
var sx=0;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){var t=e.target.closest(".task");if(!t)return;var dx=e.changedTouches[0].clientX-sx;if(dx<-50){opened=t.dataset.id;render()}else if(dx>50&&opened){opened=null;render()}});
function ping(x){toast(x);try{if(Notification.permission=="granted")navigator.serviceWorker.ready.then(function(r){r.showNotification("Ma journée",{body:x,icon:"icon-192.png"})})}catch(e){}}
function tick(){
  var n=new Date(),td=iso(n);
  if(td!=lastDay&&document.visibilityState=="visible"){lastDay=td;cur=td;render()}
  if(S.rem){var m=n.getHours()*60+n.getMinutes();day(td).forEach(function(t){var s=mins(t.start),k=t.id+td;if(!t.st&&m>=s-5&&m<s&&!notified[k]){notified[k]=1;ping("Dans "+(s-m)+" min : "+t.title)}})}
  if(view=="d"&&cur==td&&!sh&&!editId&&!sel&&!(document.activeElement&&document.activeElement.closest(".flt")))render()}
setInterval(tick,30000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState=="visible")tick()});
applyTheme();
document.addEventListener("input",function(e){var i=e.target.id;if(i=="q"||i=="fc"){q=document.getElementById("q").value;fc=document.getElementById("fc").value;var p=e.target.selectionStart;render();var n=document.getElementById(i);n.focus();try{n.setSelectionRange(p,p)}catch(x){}}});
document.addEventListener("change",function(e){var i=e.target.id;if(i=="th"){S.theme=e.target.value;applyTheme();save()}else if(i=="dd"){S.dd=+e.target.value;save()}else if(i=="fi")restore(e.target.files[0]);else if(i=="pt")document.getElementById("dur").disabled=e.target.checked});
setInterval(pmTick,1000);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
